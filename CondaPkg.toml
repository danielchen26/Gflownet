# Python dependencies for PythonCall (used by rdkit_bridge.jl)
# CondaPkg automatically resolves and installs these when PythonCall loads.

[deps]
python = ">=3.9,<3.13"

[deps.rdkit]
version = ">=2023.03"
channel = "conda-forge"

[deps.numpy]
version = ">=1.24"
channel = "conda-forge"

[deps.scikit-learn]
version = ">=1.3"
channel = "conda-forge"

[pip.deps]
umap-learn = ">=0.5"
# meeko and vina require Boost C++ headers — install separately if needed:
# meeko = ">=0.5"        # SMILES → PDBQT conversion for AutoDock Vina (Gap 2)
# vina = ">=1.2.5"       # AutoDock Vina Python bindings (Gap 2)
